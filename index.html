<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Summer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;overflow:hidden;
display:flex;justify-content:center;align-items:center;
font-family:Georgia,serif;
background:linear-gradient(to bottom,#ffd8a8 0%,#ffb784 28%,#f7dca3 45%,#76c8e5 58%,#2d88b6 100%);
}
.sun{position:absolute;top:10%;left:50%;transform:translateX(-50%);
width:170px;height:170px;border-radius:50%;
background:#ffe08c;box-shadow:0 0 100px rgba(255,224,140,.9)}
.cloud,.cloud2{
position:absolute;background:rgba(255,255,255,.75);
border-radius:60px;filter:blur(1px)}
.cloud{width:170px;height:55px;top:12%;left:-220px;animation:drift 45s linear infinite}
.cloud2{width:130px;height:45px;top:22%;right:-180px;animation:drift2 55s linear infinite}
@keyframes drift{to{left:110%}}
@keyframes drift2{to{right:110%}}
.ocean{position:absolute;bottom:0;width:100%;height:42%;
background:linear-gradient(#66c5e5,#2d88b6)}
.wave,.wave2{
position:absolute;bottom:33%;
width:200%;height:90px;border-radius:45%;
background:rgba(255,255,255,.28)}
.wave{animation:wave 10s linear infinite}
.wave2{bottom:29%;opacity:.5;animation:wave 16s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.card{
position:relative;z-index:10;
width:min(90%,700px);
padding:42px;
border-radius:30px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.35);
color:white;text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{font-size:2.7rem;font-weight:400;letter-spacing:2px}
.sub{margin:10px 0 24px;color:#fff8}
button{padding:12px 34px;border:none;border-radius:50px;background:#fff;color:#c97839;font-size:18px;cursor:pointer}
.line{opacity:0;transform:translateY(10px);transition:all 1.8s;margin:18px 0;font-size:1.25rem}
.show{opacity:1;transform:translateY(0)}
.spark{position:absolute;width:3px;height:3px;background:white;border-radius:50%;animation:float 8s linear infinite}
@keyframes float{from{transform:translateY(100vh)}to{transform:translateY(-20vh)}}
</style></head>
<body>
<div class="sun"></div><div class="cloud"></div><div class="cloud2"></div>
<div class="wave"></div><div class="wave2"></div><div class="ocean"></div>
<div class="spark" style="left:15%;animation-delay:0s"></div>
<div class="spark" style="left:35%;animation-delay:2s"></div>
<div class="spark" style="left:60%;animation-delay:4s"></div>
<div class="spark" style="left:80%;animation-delay:1s"></div>

<div class="card">
<h1>Summer</h1>
<p class="sub">Someone told me this.</p>
<button id="begin">Begin</button>

<div id="poem" style="display:none">
<p class="line">I hope when the right one comes, he won't give up on me.</p>
<p class="line">Not when I push him away.</p>
<p class="line">Not when I tell him no.</p>
<p class="line">Not when I am too confident.</p>
<p class="line">Not when my pride gets in the way.</p>
<p class="line"><strong>He will understand me.</strong></p>
</div>

<audio id="music" src="MUSIC.MP3"></audio>
</div>

<script>
begin.onclick=()=>{
music.play().catch(()=>{});
begin.style.display="none";
poem.style.display="block";
document.querySelectorAll('.line').forEach((e,i)=>setTimeout(()=>e.classList.add('show'),i*3200));
}
</script>
</body></html>
